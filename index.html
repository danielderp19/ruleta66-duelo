<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta 66</title>
  <style>
    :root {
      --paper: #f1e7cf;
      --gold: #d8a744;
      --red: #b81d2b;
      --green: #34d399;
      --steel: #b7bcc2;
      --ink: #f8f4e9;
      --black: #070606;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 28%, rgba(245, 213, 137, 0.2), transparent 24%),
        radial-gradient(circle at 10% 15%, rgba(184, 29, 43, 0.26), transparent 34%),
        radial-gradient(circle at 85% 18%, rgba(52, 211, 153, 0.14), transparent 28%),
        linear-gradient(135deg, #050505 0%, #18100d 42%, #040403 100%);
    }

    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.55;
      background:
        repeating-linear-gradient(88deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 8px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 5px);
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .game::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      background:
        radial-gradient(circle at center, transparent 0 46%, rgba(0, 0, 0, 0.28) 70%, rgba(0, 0, 0, 0.88) 100%),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent 20%, rgba(0, 0, 0, 0.44));
      pointer-events: none;
    }

    #scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      grid-template-rows: auto 1fr auto;
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: clamp(18px, 3vw, 34px);
    }

    .brand {
      max-width: min(520px, 62vw);
    }

    h1 {
      margin: 0;
      color: #fff8e7;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 8vw, 122px);
      font-weight: 700;
      line-height: 0.86;
      text-transform: uppercase;
      text-shadow: 0 6px 28px rgba(0, 0, 0, 0.78), 0 0 42px rgba(216, 167, 68, 0.16);
    }

    .subtitle {
      margin: 14px 0 0;
      max-width: 40rem;
      color: rgba(248, 244, 233, 0.82);
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.5;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.72);
    }

    .stats {
      width: min(330px, 35vw);
      display: grid;
      gap: 10px;
    }

    .meter {
      padding: 13px 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(10, 9, 8, 0.58);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 18px 40px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
    }

    .meter span {
      display: block;
      color: rgba(248, 244, 233, 0.58);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .meter strong {
      display: block;
      margin-top: 4px;
      color: #fff7df;
      font-size: clamp(18px, 2.4vw, 32px);
      line-height: 1;
    }

    .center-message {
      align-self: end;
      justify-self: center;
      width: min(860px, calc(100vw - 32px));
      margin-bottom: min(14vh, 104px);
      text-align: center;
      pointer-events: none;
      transform: translateY(8px);
      opacity: 0;
      transition: opacity 480ms ease, transform 480ms ease;
    }

    .center-message.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .result-title {
      margin: 0;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 8vw, 114px);
      line-height: 0.9;
      text-transform: uppercase;
      text-shadow: 0 10px 34px rgba(0, 0, 0, 0.9);
    }

    .result-copy {
      margin: 12px auto 0;
      max-width: 520px;
      color: rgba(248, 244, 233, 0.82);
      font-size: clamp(15px, 1.8vw, 19px);
      line-height: 1.45;
    }

    .controls {
      position: relative;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 clamp(16px, 3vw, 34px) clamp(18px, 3vw, 34px);
      pointer-events: auto;
    }

    .primary,
    .ghost {
      min-height: 52px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 180ms ease, filter 180ms ease, opacity 180ms ease;
    }

    .primary {
      min-width: min(320px, calc(100vw - 142px));
      padding: 0 26px;
      color: #1d1107;
      background:
        linear-gradient(180deg, #fff1b8, #d8a744 44%, #8b5d18 100%);
      box-shadow: 0 18px 46px rgba(216, 167, 68, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.78);
      font-weight: 900;
      text-transform: uppercase;
    }

    .ghost {
      width: 52px;
      color: rgba(255, 248, 229, 0.86);
      background: rgba(13, 12, 10, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.17);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .primary:hover,
    .ghost:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .primary:disabled,
    .ghost:disabled {
      cursor: wait;
      opacity: 0.62;
      transform: none;
    }

    .death-flash {
      position: absolute;
      inset: 0;
      z-index: 6;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.78), rgba(184, 29, 43, 0.56) 28%, rgba(0, 0, 0, 0.95) 72%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .death-flash.hit {
      animation: fatalFlash 1200ms ease-out both;
    }

    @keyframes fatalFlash {
      0% { opacity: 0; }
      8% { opacity: 1; }
      34% { opacity: 0.42; }
      100% { opacity: 0; }
    }

    .shake {
      animation: shake 620ms cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    @media (max-width: 760px) {
      .topbar {
        display: grid;
        gap: 14px;
      }

      .brand,
      .stats {
        width: 100%;
        max-width: none;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .meter {
        padding: 10px;
      }

      .meter strong {
        font-size: 18px;
      }

      .subtitle {
        max-width: 96vw;
      }

      .center-message {
        margin-bottom: 15vh;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .subtitle {
        display: none;
      }

      .controls {
        gap: 8px;
      }

      .primary {
        min-width: 0;
        flex: 1;
        padding: 0 14px;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <canvas id="scene" aria-label="Ruleta hiperrealista"></canvas>
    <div class="death-flash" id="deathFlash"></div>

    <section class="hud" aria-live="polite">
      <div class="topbar">
        <div class="brand">
          <h1>Ruleta 66</h1>
          <p class="subtitle">Cuatro cámaras vacías. Dos cámaras fatales. Presiona una vez, mira girar el cilindro y deja que el azar decida.</p>
        </div>
        <div class="stats">
          <div class="meter">
            <span>Probabilidad</span>
            <strong>66%</strong>
          </div>
          <div class="meter">
            <span>Ronda</span>
            <strong id="round">0</strong>
          </div>
          <div class="meter">
            <span>Racha viva</span>
            <strong id="streak">0</strong>
          </div>
        </div>
      </div>

      <div class="center-message visible" id="message">
        <h2 class="result-title">Respira</h2>
        <p class="result-copy">La ruleta esta cargada a tu favor, pero no lo suficiente como para confiarte.</p>
      </div>

      <div class="controls">
        <button class="ghost" id="sound" type="button" aria-label="Activar o silenciar sonido">♪</button>
        <button class="primary" id="spin" type="button">Girar la ruleta</button>
        <button class="ghost" id="reset" type="button" aria-label="Reiniciar">↻</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d", { alpha: false });
    const game = document.getElementById("game");
    const spinButton = document.getElementById("spin");
    const resetButton = document.getElementById("reset");
    const soundButton = document.getElementById("sound");
    const roundEl = document.getElementById("round");
    const streakEl = document.getElementById("streak");
    const message = document.getElementById("message");
    const deathFlash = document.getElementById("deathFlash");

    const state = {
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      width: 0,
      height: 0,
      angle: -0.35,
      targetAngle: -0.35,
      spinning: false,
      spinStart: 0,
      spinDuration: 0,
      particles: [],
      embers: [],
      round: 0,
      streak: 0,
      outcome: "idle",
      muted: false,
      audio: null,
      lastTick: 0,
      lampPulse: 0
    };

    function resize() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      seedDust();
    }

    function seedDust() {
      state.embers = Array.from({ length: Math.round(Math.min(130, state.width / 9)) }, () => ({
        x: Math.random() * state.width,
        y: Math.random() * state.height,
        z: 0.35 + Math.random() * 1.2,
        a: Math.random() * Math.PI * 2,
        s: 0.25 + Math.random() * 1.2
      }));
    }

    function audioContext() {
      if (!state.audio) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        state.audio = new AudioCtx();
      }
      if (state.audio.state === "suspended") state.audio.resume();
      return state.audio;
    }

    function tone(freq, duration, type = "sine", gain = 0.05, delay = 0) {
      if (state.muted) return;
      const audio = audioContext();
      const osc = audio.createOscillator();
      const amp = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audio.currentTime + delay);
      amp.gain.setValueAtTime(0.0001, audio.currentTime + delay);
      amp.gain.exponentialRampToValueAtTime(gain, audio.currentTime + delay + 0.018);
      amp.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + delay + duration);
      osc.connect(amp).connect(audio.destination);
      osc.start(audio.currentTime + delay);
      osc.stop(audio.currentTime + delay + duration + 0.04);
    }

    function noiseBurst(duration, gain = 0.08, delay = 0) {
      if (state.muted) return;
      const audio = audioContext();
      const buffer = audio.createBuffer(1, audio.sampleRate * duration, audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      }
      const src = audio.createBufferSource();
      const amp = audio.createGain();
      const filter = audio.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 720;
      amp.gain.value = gain;
      src.buffer = buffer;
      src.connect(filter).connect(amp).connect(audio.destination);
      src.start(audio.currentTime + delay);
    }

    function setMessage(title, copy, visible = true) {
      message.querySelector(".result-title").textContent = title;
      message.querySelector(".result-copy").textContent = copy;
      message.classList.toggle("visible", visible);
    }

    function reset() {
      state.round = 0;
      state.streak = 0;
      state.outcome = "idle";
      state.targetAngle = -0.35;
      state.angle = -0.35;
      state.spinning = false;
      roundEl.textContent = "0";
      streakEl.textContent = "0";
      spinButton.disabled = false;
      spinButton.textContent = "Girar la ruleta";
      setMessage("Respira", "La ruleta esta cargada a tu favor, pero no lo suficiente como para confiarte.");
    }

    function spin() {
      if (state.spinning) return;
      audioContext();
      state.round += 1;
      roundEl.textContent = String(state.round);
      state.spinning = true;
      state.outcome = "spinning";
      spinButton.disabled = true;
      resetButton.disabled = true;
      spinButton.textContent = "Girando...";
      setMessage("", "", false);

      const win = Math.random() < 0.66;
      const chamberIndex = win ? Math.floor(Math.random() * 4) : 4 + Math.floor(Math.random() * 2);
      const chamberAngle = chamberIndex * Math.PI / 3;
      const fullTurns = 6 + Math.floor(Math.random() * 4);
      state.spinStart = performance.now();
      state.spinDuration = 3550 + Math.random() * 900;
      state.startAngle = state.angle;
      state.targetAngle = fullTurns * Math.PI * 2 - chamberAngle - Math.PI / 2;
      state.pendingWin = win;
      state.pendingChamber = chamberIndex;

      for (let i = 0; i < 9; i += 1) {
        tone(180 + i * 22, 0.06, "triangle", 0.025, i * 0.085);
      }
    }

    function finishSpin() {
      const win = state.pendingWin;
      state.spinning = false;
      spinButton.disabled = false;
      resetButton.disabled = false;
      spinButton.textContent = "Volver a girar";
      state.outcome = win ? "win" : "lose";

      if (win) {
        state.streak += 1;
        streakEl.textContent = String(state.streak);
        setMessage("Sigues vivo", "La camara quedo vacia. El metal se enfria, pero tus manos no.");
        tone(392, 0.12, "sine", 0.05);
        tone(523.25, 0.18, "sine", 0.04, 0.12);
        burstSparks(34, "#34d399");
      } else {
        state.streak = 0;
        streakEl.textContent = "0";
        setMessage("Has muerto", "La probabilidad fallo. En esta mesa, una mala ronda lo apaga todo.");
        spinButton.textContent = "Intentar otra vida";
        deathFlash.classList.remove("hit");
        void deathFlash.offsetWidth;
        deathFlash.classList.add("hit");
        game.classList.remove("shake");
        void game.offsetWidth;
        game.classList.add("shake");
        noiseBurst(0.38, 0.16);
        tone(58, 0.7, "sawtooth", 0.12);
        burstSparks(80, "#b81d2b");
      }
    }

    function burstSparks(count, color) {
      const cx = state.width * 0.5;
      const cy = state.height * 0.54;
      for (let i = 0; i < count; i += 1) {
        const a = Math.random() * Math.PI * 2;
        const v = 2 + Math.random() * 7;
        state.particles.push({
          x: cx + (Math.random() - 0.5) * 130,
          y: cy + (Math.random() - 0.5) * 80,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v - Math.random() * 3,
          life: 1,
          size: 1 + Math.random() * 4,
          color
        });
      }
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function drawTable(time) {
      const w = state.width;
      const h = state.height;
      const grd = ctx.createLinearGradient(0, 0, w, h);
      grd.addColorStop(0, "#1a1010");
      grd.addColorStop(0.45, "#271510");
      grd.addColorStop(1, "#050404");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.globalAlpha = 0.42;
      for (let y = h * 0.48; y < h; y += 10) {
        ctx.strokeStyle = `rgba(255, 220, 150, ${0.018 + Math.sin(y * 0.09 + time * 0.0008) * 0.01})`;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(w * 0.26, y - 18, w * 0.62, y + 22, w, y - 10);
        ctx.stroke();
      }
      ctx.restore();

      const lamp = ctx.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.42, Math.min(w, h) * 0.64);
      lamp.addColorStop(0, `rgba(255, 221, 144, ${0.22 + state.lampPulse * 0.04})`);
      lamp.addColorStop(0.34, "rgba(117, 72, 32, 0.18)");
      lamp.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = lamp;
      ctx.fillRect(0, 0, w, h);
    }

    function drawDust(dt) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (const mote of state.embers) {
        mote.a += dt * 0.00018 * mote.z;
        mote.x += Math.cos(mote.a) * 0.08 * mote.z;
        mote.y += Math.sin(mote.a * 0.7) * 0.05 * mote.z - 0.008;
        if (mote.y < -12) mote.y = state.height + 12;
        if (mote.x < -12) mote.x = state.width + 12;
        if (mote.x > state.width + 12) mote.x = -12;
        ctx.globalAlpha = 0.04 + mote.z * 0.04;
        ctx.fillStyle = "#ffe8a6";
        ctx.beginPath();
        ctx.arc(mote.x, mote.y, mote.s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawCylinder(time) {
      const w = state.width;
      const h = state.height;
      const cx = w * 0.5;
      const cy = h * (w < 760 ? 0.58 : 0.55);
      const radius = Math.min(w, h) * (w < 760 ? 0.27 : 0.24);
      const tilt = 0.7;

      ctx.save();
      ctx.translate(cx, cy + radius * 0.24);
      ctx.scale(1.12, tilt);
      ctx.rotate(-0.08);

      const shadow = ctx.createRadialGradient(0, radius * 0.38, radius * 0.1, 0, radius * 0.4, radius * 1.55);
      shadow.addColorStop(0, "rgba(0, 0, 0, 0.62)");
      shadow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.ellipse(0, radius * 0.43, radius * 1.55, radius * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, tilt);
      ctx.rotate(state.angle);

      for (let layer = 0; layer < 9; layer += 1) {
        ctx.beginPath();
        ctx.arc(0, 0, radius + layer * 1.8, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 248, 220, ${0.055 - layer * 0.004})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      const metal = ctx.createRadialGradient(-radius * 0.35, -radius * 0.5, radius * 0.06, 0, 0, radius * 1.08);
      metal.addColorStop(0, "#f5f0db");
      metal.addColorStop(0.12, "#bfc4c8");
      metal.addColorStop(0.34, "#5e656a");
      metal.addColorStop(0.58, "#d9d5c1");
      metal.addColorStop(0.76, "#41464d");
      metal.addColorStop(1, "#111316");
      ctx.fillStyle = metal;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 6; i += 1) {
        const a = i * Math.PI / 3;
        const x = Math.cos(a) * radius * 0.52;
        const y = Math.sin(a) * radius * 0.52;
        const chamberR = radius * 0.19;
        const danger = i >= 4;
        const ch = ctx.createRadialGradient(x - chamberR * 0.36, y - chamberR * 0.42, 1, x, y, chamberR * 1.2);
        ch.addColorStop(0, danger ? "#875b4d" : "#cad3d4");
        ch.addColorStop(0.27, danger ? "#39201f" : "#51585e");
        ch.addColorStop(0.72, "#0b0c0d");
        ch.addColorStop(1, "#030303");
        ctx.fillStyle = ch;
        ctx.beginPath();
        ctx.arc(x, y, chamberR, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = Math.max(2, radius * 0.018);
        ctx.strokeStyle = danger ? "rgba(255, 83, 83, 0.36)" : "rgba(255, 255, 255, 0.22)";
        ctx.stroke();

        if (danger) {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.22 + Math.sin(time * 0.004 + i) * 0.07;
          ctx.fillStyle = "#ff3f45";
          ctx.beginPath();
          ctx.arc(x, y, chamberR * 0.44, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      const hub = ctx.createRadialGradient(-radius * 0.1, -radius * 0.18, 1, 0, 0, radius * 0.31);
      hub.addColorStop(0, "#fff7d9");
      hub.addColorStop(0.42, "#ac8954");
      hub.addColorStop(1, "#17120d");
      ctx.fillStyle = hub;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.24, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = radius * 0.04;
      ctx.strokeStyle = "rgba(255, 238, 181, 0.38)";
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.86, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();

      drawPointer(cx, cy, radius, tilt, time);
    }

    function drawPointer(cx, cy, radius, tilt, time) {
      ctx.save();
      ctx.translate(cx, cy - radius * tilt - 24);
      ctx.globalCompositeOperation = "screen";
      const pulse = 0.64 + Math.sin(time * 0.006) * 0.16;
      ctx.fillStyle = `rgba(255, 238, 183, ${pulse})`;
      ctx.shadowColor = "#ffd96c";
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-14, -34);
      ctx.lineTo(14, -34);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawGunSilhouette() {
      const w = state.width;
      const h = state.height;
      const cx = w * 0.5;
      const cy = h * (w < 760 ? 0.76 : 0.75);
      const s = Math.min(w, h) * 0.26;

      ctx.save();
      ctx.translate(cx - s * 0.04, cy);
      ctx.rotate(-0.02);
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = "rgba(5, 5, 5, 0.74)";
      ctx.shadowColor = "rgba(0, 0, 0, 0.82)";
      ctx.shadowBlur = 24;

      roundRect(-s * 1.25, -s * 0.15, s * 1.85, s * 0.26, s * 0.07);
      ctx.fill();
      roundRect(s * 0.3, -s * 0.12, s * 0.76, s * 0.2, s * 0.05);
      ctx.fill();
      roundRect(-s * 0.36, s * 0.02, s * 0.34, s * 0.92, s * 0.06);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-s * 0.02, s * 0.18, s * 0.28, Math.PI * 0.12, Math.PI * 1.55);
      ctx.lineWidth = s * 0.09;
      ctx.strokeStyle = "rgba(5, 5, 5, 0.74)";
      ctx.stroke();

      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-s * 1.18, -s * 0.15);
      ctx.lineTo(s * 0.98, -s * 0.12);
      ctx.stroke();
      ctx.restore();
    }

    function roundRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawParticles(dt) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (let i = state.particles.length - 1; i >= 0; i -= 1) {
        const p = state.particles[i];
        p.life -= dt / 900;
        p.vy += 0.045 * dt / 16;
        p.x += p.vx * dt / 16;
        p.y += p.vy * dt / 16;
        if (p.life <= 0) {
          state.particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawLetterbox() {
      const h = state.height;
      const band = Math.max(22, h * 0.055);
      ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
      ctx.fillRect(0, 0, state.width, band);
      ctx.fillRect(0, h - band, state.width, band);
    }

    function render(time) {
      const dt = Math.min(40, time - (state.lastTick || time));
      state.lastTick = time;
      state.lampPulse = Math.sin(time * 0.0014);

      if (state.spinning) {
        const t = Math.min(1, (time - state.spinStart) / state.spinDuration);
        const eased = easeOutCubic(t);
        state.angle = state.startAngle + (state.targetAngle - state.startAngle) * eased;
        if (Math.random() < 0.42 * (1 - t)) {
          const clickPitch = 240 + Math.random() * 80;
          tone(clickPitch, 0.026, "square", 0.012);
        }
        if (t >= 1) finishSpin();
      } else {
        state.angle += Math.sin(time * 0.0007) * 0.0006;
      }

      drawTable(time);
      drawDust(dt);
      drawGunSilhouette();
      drawCylinder(time);
      drawParticles(dt);
      drawLetterbox();
      requestAnimationFrame(render);
    }

    spinButton.addEventListener("click", spin);
    resetButton.addEventListener("click", reset);
    soundButton.addEventListener("click", () => {
      state.muted = !state.muted;
      soundButton.textContent = state.muted ? "×" : "♪";
      soundButton.setAttribute("aria-label", state.muted ? "Activar sonido" : "Silenciar sonido");
    });
    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        spin();
      }
      if (event.key.toLowerCase() === "r") reset();
    });

    resize();
    requestAnimationFrame(render);
  </script>
</body>
</html>
